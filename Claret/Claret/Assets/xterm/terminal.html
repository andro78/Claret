<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Claret</title>
    <link rel="stylesheet" href="./xterm.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0c0c0c;
        }

        /*
           The gap around the terminal is an inset, not padding. The fit addon measures this
           element's computed height and subtracts only the padding of the .xterm child, so padding
           here would count as usable space: it would ask the PTY for one row more than fits, and
           the last line — a TUI's status bar, usually — would be clipped at the bottom edge.
        */
        #term {
            position: absolute;
            inset: 6px 4px 6px 8px;
        }

        /* WebView2 renders its own scrollbar chrome; keep xterm's slim and dark. */
        .xterm-viewport::-webkit-scrollbar { width: 10px; }
        .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
        .xterm-viewport::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 5px;
        }
        .xterm-viewport::-webkit-scrollbar-thumb:hover { background: #5f5f5f; }
    </style>
</head>
<body>
    <div id="term"></div>

    <script src="./xterm.js"></script>
    <script src="./addon-fit.js"></script>
    <script src="./addon-webgl.js"></script>
    <script>
        (function () {
            'use strict';

            var host = window.chrome && window.chrome.webview;
            var encoder = new TextEncoder();

            function bytesFromBase64(b64) {
                var bin = atob(b64);
                var out = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) {
                    out[i] = bin.charCodeAt(i);
                }
                return out;
            }

            function base64FromString(text) {
                var bytes = encoder.encode(text);
                var bin = '';
                // Chunked to stay clear of the argument-count limit on large selections.
                for (var i = 0; i < bytes.length; i += 0x8000) {
                    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
                }
                return btoa(bin);
            }

            function post(message) {
                if (host) {
                    host.postMessage(message);
                }
            }

            // Kept so a theme patch from the host can be merged instead of replacing the palette.
            var baseTheme = null;

            function applyTheme(patch) {
                var merged = {};
                var key;
                for (key in baseTheme) {
                    if (Object.prototype.hasOwnProperty.call(baseTheme, key)) {
                        merged[key] = baseTheme[key];
                    }
                }
                for (key in patch) {
                    if (Object.prototype.hasOwnProperty.call(patch, key) && patch[key]) {
                        merged[key] = patch[key];
                    }
                }
                term.options.theme = merged;
            }

            var term = new Terminal({
                // Decorations, used for keyword highlighting, are still proposed API in xterm.js;
                // registerDecoration throws outright without this.
                allowProposedApi: true,
                cursorBlink: true,
                cursorStyle: 'bar',
                // D2Coding first for anyone who has it (Hangul is exactly 2x the Latin advance);
                // GulimChe is the always-present Windows fallback with the same 2:1 metrics.
                fontFamily: "'D2Coding', 'Cascadia Mono', 'Consolas', 'GulimChe', 'Malgun Gothic', monospace",
                fontSize: 14,
                lineHeight: 1.2,
                // Overridden as soon as the host posts its own preference ('l'); matches that
                // setting's shipped default so there is nothing to see change on a fresh session.
                scrollback: 5000,
                drawBoldTextInBrightColors: true,
                rightClickSelectsWord: false,
                theme: {
                    background: '#0c0c0c',
                    foreground: '#e6e6e6',
                    cursor: '#f5c542',
                    cursorAccent: '#0c0c0c',
                    selectionBackground: '#3a5f8a',
                    black: '#0c0c0c',
                    red: '#c50f1f',
                    green: '#13a10e',
                    yellow: '#c19c00',
                    blue: '#0037da',
                    magenta: '#881798',
                    cyan: '#3a96dd',
                    white: '#cccccc',
                    brightBlack: '#767676',
                    brightRed: '#e74856',
                    brightGreen: '#16c60c',
                    brightYellow: '#f9f1a5',
                    brightBlue: '#3b78ff',
                    brightMagenta: '#b4009e',
                    brightCyan: '#61d6d6',
                    brightWhite: '#f2f2f2'
                }
            });

            baseTheme = term.options.theme;

            var fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(document.getElementById('term'));

            // The WebGL renderer draws box-drawing/block characters itself instead of relying on
            // the font, so TUI frames have no seams, and it clips every glyph to its cell so a
            // fallback Hangul font cannot break column alignment. Falls back to DOM if unavailable.
            (function attachWebgl() {
                if (typeof WebglAddon === 'undefined') {
                    post('ewebgl addon missing');
                    return;
                }

                try {
                    var webgl = new WebglAddon.WebglAddon();
                    webgl.onContextLoss(function () {
                        webgl.dispose(); // xterm reverts to the DOM renderer on dispose
                    });
                    term.loadAddon(webgl);
                } catch (e) {
                    post('ewebgl unavailable: ' + e);
                }
            })();

            function safeFit() {
                // While the tab is unselected the host has no layout. Fitting then would collapse
                // the grid to 2x1 and push that bogus size to the remote PTY, wrecking the shell.
                var host = document.getElementById('term');
                if (!host || host.clientWidth < 4 || host.clientHeight < 4) {
                    return;
                }

                try {
                    fitAddon.fit();
                } catch (e) {
                    /* element not laid out yet */
                }
            }

            function setFontSize(size) {
                var next = Math.min(28, Math.max(8, size));
                if (next !== term.options.fontSize) {
                    term.options.fontSize = next;
                    safeFit();
                }
            }

            function changeFontSize(delta) {
                setFontSize(term.options.fontSize + delta);
            }

            // ---- font, and why Hangul needs one picked carefully ---------------------------
            // A terminal gives a wide character exactly two cells. Hangul only fills them when
            // the font advances 2x its Latin width for one syllable; with a Latin font plus a
            // fallback for Hangul the glyph is narrower than its cells and columns drift apart.
            // These faces get it right: D2Coding and NanumGothicCoding (both Korean coding
            // fonts), and the old Windows *Che faces, which ship with Windows.
            var HANGUL_FONTS = ['D2Coding', 'NanumGothicCoding', 'GulimChe', 'DotumChe'];
            var FALLBACK_FONTS = "'Cascadia Mono', 'Consolas', 'GulimChe', 'Malgun Gothic', monospace";
            var metricsProbe = null;

            // Measures one family on its own. A family that is not installed falls back to the
            // proportional UI font, which fails the monospace test — that is how absence is told.
            function fontMetrics(family) {
                if (!metricsProbe) {
                    metricsProbe = document.createElement('canvas').getContext('2d');
                }

                metricsProbe.font = "64px '" + family + "'";
                var latin = metricsProbe.measureText('M').width;
                var narrow = metricsProbe.measureText('i').width;
                var wide = metricsProbe.measureText('가').width;

                return {
                    monospace: latin > 0 && Math.abs(latin - narrow) < 0.05,
                    ratio: latin > 0 ? wide / latin : 0
                };
            }

            function alignsHangul(family) {
                var m = fontMetrics(family);
                return m.monospace && Math.abs(m.ratio - 2) < 0.02;
            }

            function fontStack(request) {
                if (request) {
                    return "'" + request + "', " + FALLBACK_FONTS;
                }

                for (var i = 0; i < HANGUL_FONTS.length; i++) {
                    if (alignsHangul(HANGUL_FONTS[i])) {
                        return "'" + HANGUL_FONTS[i] + "', " + FALLBACK_FONTS;
                    }
                }

                return FALLBACK_FONTS;
            }

            function applyFontFamily(request) {
                var stack = fontStack(request);
                if (stack === term.options.fontFamily) {
                    return;
                }

                term.options.fontFamily = stack;
                safeFit();
            }

            // Start aligned: the host sends its own choice a moment later, but the first frames
            // are drawn before that arrives.
            applyFontFamily('');



            // ---- keyword highlighting ------------------------------------------------------
            // Rules come from the host as JSON. Matching runs over the visible rows only and
            // paints cell decorations, so nothing is injected into the byte stream: a TUI's own
            // colours stay intact and the highlight disappears cleanly when a rule is removed.
            var highlightRules = [];
            var decorations = [];
            var highlightTimer = 0;
            var HIGHLIGHT_LIMIT = 2000;


            function setHighlightRules(list) {
                highlightRules = [];

                for (var i = 0; i < list.length; i++) {
                    var rule = list[i];
                    if (!rule || !rule.pattern) {
                        continue;
                    }

                    // Patterns are literal text, so the metacharacters are escaped here: "1.2.3"
                    // must not match "1x2y3".
                    var source = rule.pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    var colour = rule.color || '#f5c542';

                    try {
                        highlightRules.push({
                            re: new RegExp(source, rule.ignoreCase ? 'gi' : 'g'),
                            // Text-only leaves the cell background alone and colours the glyphs;
                            // a block paints the cells and picks ink that stays readable on them.
                            background: rule.textOnly ? undefined : colour,
                            foreground: rule.textOnly ? colour : readableInk(colour)
                        });
                    } catch (e) {
                        post('ehighlight pattern rejected: ' + rule.pattern);
                    }
                }

                scheduleHighlight();
            }

            // Dark text on a light highlight and vice versa, so a match is always readable.
            function readableInk(hex) {
                var m = /^#?([0-9a-f]{6})$/i.exec(hex);
                if (!m) {
                    return '#000000';
                }

                var value = parseInt(m[1], 16);
                var r = (value >> 16) & 255;
                var g = (value >> 8) & 255;
                var b = value & 255;
                return (r * 299 + g * 587 + b * 114) / 1000 >= 140 ? '#000000' : '#ffffff';
            }

            function clearDecorations() {
                for (var i = 0; i < decorations.length; i++) {
                    try {
                        decorations[i].dispose();
                    } catch (e) {
                        /* already gone with its line */
                    }
                }

                decorations = [];
            }

            function scheduleHighlight() {
                if (highlightTimer) {
                    return;
                }

                highlightTimer = setTimeout(function () {
                    highlightTimer = 0;
                    applyHighlights();
                }, 50);
            }

            // Cells, not characters: a wide glyph occupies two columns but one string index, so a
            // match's column has to be looked up rather than assumed equal to its string offset.
            function readRow(line) {
                var text = '';
                var columns = [];
                var cell = line.getCell(0);

                for (var x = 0; x < line.length; x++) {
                    cell = line.getCell(x, cell);
                    if (!cell) {
                        continue;
                    }

                    var chars = cell.getChars();
                    if (cell.getWidth() === 0) {
                        continue;   // trailing half of a wide glyph
                    }

                    if (chars === '') {
                        chars = ' ';
                    }

                    for (var c = 0; c < chars.length; c++) {
                        columns.push(x);
                    }

                    text += chars;
                }

                columns.push(line.length);
                return { text: text, columns: columns };
            }

            // Everything currently in the buffer — scrollback plus the visible screen — as plain
            // text, so a pane that has stopped (a serial port just closed, say) can still have what
            // it already showed saved to a file. translateToString resolves wide glyphs and
            // combining marks on its own, unlike readRow, which exists only for column bookkeeping.
            function bufferText() {
                var buf = term.buffer.active;
                var lines = [];

                for (var i = 0; i < buf.length; i++) {
                    var line = buf.getLine(i);
                    lines.push(line ? line.translateToString(true) : '');
                }

                while (lines.length > 0 && lines[lines.length - 1] === '') {
                    lines.pop();
                }

                return lines.join('\n');
            }

            // ---- answering an AI CLI approval prompt -----------------------------------------
            // Codex and Claude Code stop on a numbered list whose first entry is "Yes": option 1
            // runs the command, option 2 runs it and stops asking, and the last one refuses. Gemini
            // CLI never says "Yes" at all — its options read "Allow once" / "Allow for this
            // session" / "No, suggest changes" — and picking "once" there would just mean answering
            // the very same prompt again for the next command, so the session grant is the one
            // worth automating instead. With this on, whichever of those is present is chosen
            // automatically — using the shortcut the prompt itself advertises, e.g. "(y)", or the
            // digit when it advertises none.
            var autoApprove = false;
            var lastApproved = '';
            var lastApprovedAt = 0;

            var YES_LINE = /^[\s•›>*\-]*([1-9])[.)]\s+(Yes\b.*)$/i;
            var SESSION_LINE = /^[\s•›>*\-]*([1-9])[.)]\s+(Allow for this session\b.*)$/i;
            var OPTION_LINE = /^[\s•›>*\-]*[1-9][.)]\s+\S/;
            var SHORTCUT = /\(([A-Za-z])\)\s*$/;

            function maybeAutoApprove(rows) {
                if (!autoApprove) {
                    lastApproved = '';
                    return;
                }

                var yes = null;
                var sessionAllow = null;
                var options = 0;

                for (var i = 0; i < rows.length; i++) {
                    var text = rows[i].replace(/\s+$/, '');
                    if (!OPTION_LINE.test(text)) {
                        continue;
                    }

                    options++;

                    var match = YES_LINE.exec(text);
                    if (match && (yes === null || match[1] < yes.digit)) {
                        yes = { digit: match[1], text: match[2] };
                    }

                    var sessionMatch = SESSION_LINE.exec(text);
                    if (sessionMatch && sessionAllow === null) {
                        sessionAllow = { digit: sessionMatch[1], text: sessionMatch[2] };
                    }
                }

                var choice = yes || sessionAllow;

                // A lone matching line is prose somewhere; a real prompt also offers a way out.
                if (choice === null || options < 2) {
                    lastApproved = '';
                    return;
                }

                var signature = choice.digit + ':' + choice.text;
                var now = Date.now();

                // The prompt stays on screen until the CLI redraws, so the same one must not be
                // answered twice.
                if (signature === lastApproved && now - lastApprovedAt < 4000) {
                    return;
                }

                lastApproved = signature;
                lastApprovedAt = now;

                var shortcut = SHORTCUT.exec(choice.text);
                post('i' + base64FromString(shortcut ? shortcut[1] : choice.digit));
                post('n' + signature);
            }

            function applyHighlights() {
                clearDecorations();

                if (!term.element || (highlightRules.length === 0 && !autoApprove)) {
                    return;
                }

                var buffer = term.buffer.active;
                var anchor = buffer.baseY + buffer.cursorY;
                var rows = [];

                for (var row = 0; row < term.rows; row++) {
                    var absolute = buffer.viewportY + row;
                    var line = buffer.getLine(absolute);
                    if (!line) {
                        continue;
                    }

                    var scan = readRow(line);
                    rows.push(scan.text);

                    if (scan.text.trim() === '') {
                        continue;
                    }

                    for (var r = 0; r < highlightRules.length; r++) {
                        var rule = highlightRules[r];
                        rule.re.lastIndex = 0;

                        var match;
                        while ((match = rule.re.exec(scan.text)) !== null) {
                            if (match[0].length === 0) {
                                rule.re.lastIndex++;   // a zero-width match would spin forever
                                continue;
                            }

                            var startX = scan.columns[match.index];
                            var endX = scan.columns[match.index + match[0].length];
                            if (startX === undefined || endX === undefined || endX <= startX) {
                                continue;
                            }

                            if (!decorate(absolute - anchor, startX, endX - startX, rule)) {
                                maybeAutoApprove(rows);
                                return;   // hit the cap; stop scanning entirely
                            }
                        }
                    }
                }

                maybeAutoApprove(rows);
            }

            function decorate(offset, x, width, rule) {
                if (decorations.length >= HIGHLIGHT_LIMIT) {
                    return false;
                }

                var marker = term.registerMarker(offset);
                if (!marker) {
                    return true;
                }

                var decoration = term.registerDecoration({
                    marker: marker,
                    x: x,
                    width: width,
                    backgroundColor: rule.background,
                    foregroundColor: rule.foreground,
                    layer: 'bottom'
                });

                if (!decoration) {
                    marker.dispose();
                    return true;
                }

                decorations.push(decoration);
                return true;
            }

            // Re-scan on the events that actually change what is on screen. Deliberately not
            // onRender: creating decorations triggers a render, which would loop forever.
            term.onWriteParsed(scheduleHighlight);
            term.onScroll(scheduleHighlight);
            term.onResize(scheduleHighlight);
            // Terminal -> host
            term.onData(function (data) {
                post('i' + base64FromString(data));
            });

            term.onBinary(function (data) {
                // Already a byte string (one char per byte) from mouse/bracketed-paste reports.
                post('i' + btoa(data));
            });

            term.onResize(function (size) {
                post('r' + size.cols + ',' + size.rows);
            });

            term.onTitleChange(function (title) {
                post('t' + base64FromString(title));
            });

            // Clipboard is handled on the host side: the WebView sandbox would otherwise
            // prompt for permission and cannot reach the Windows clipboard directly.

            /*
                Take the key for ourselves. Returning false only tells xterm to leave the key
                alone — it does not stop the browser, which still runs its own edit command for
                Ctrl+V and Ctrl+Shift+V (WebView2's AreBrowserAcceleratorKeysEnabled=false does
                not cover editing keys). That command pastes into the hidden textarea, xterm's own
                paste listener sends it, and the text arrives twice: once from the browser and
                once from our clipboard round trip. Cancelling the event leaves one path.
            */
            function claim(ev) {
                ev.preventDefault();
                return false;
            }

            /*
                With a Korean IME switched on, a keydown it has looked at arrives as key
                "Process" with keyCode 229 — whether or not the IME will actually consume it. Two
                things follow for the chords below. The composition gate cannot treat 229 alone as
                "this belongs to the IME", and the chords cannot be matched on ev.key. ev.code
                carries the physical key whatever the IME does, so it is the fallback.
            */
            function chordKey(ev) {
                if (ev.key && ev.key !== 'Process' && ev.key !== 'Unidentified') {
                    return ev.key;
                }

                var code = ev.code || '';
                if (code.length === 4 && code.indexOf('Key') === 0) {
                    return code.charAt(3);          // KeyC -> C
                }
                if (code.indexOf('Digit') === 0) {
                    return code.slice(5);           // Digit0 -> 0
                }
                if (code === 'Equal') {
                    return '=';
                }
                if (code === 'Minus') {
                    return '-';
                }

                return code || ev.key || '';
            }

            term.attachCustomKeyEventHandler(function (ev) {
                if (ev.type !== 'keydown') {
                    return true;
                }
                // Mid-composition (Hangul, kana, pinyin) every key belongs to the IME. Claiming
                // one here would commit or drop a syllable half-built.
                if (ev.isComposing) {
                    return true;
                }
                // A chord holding Ctrl or Alt is never IME text input, so the 229 marker on its
                // own must not swallow it. It used to, which left every shortcut below dead the
                // moment the keyboard was in Hangul mode — copy and paste among them.
                if (ev.keyCode === 229 && !ev.ctrlKey && !ev.altKey) {
                    return true;
                }

                var key = chordKey(ev);
                if (ev.ctrlKey && ev.shiftKey && (key === 'C' || key === 'c')) {
                    copySelection();
                    return claim(ev);
                }
                if (ev.ctrlKey && ev.shiftKey && (key === 'V' || key === 'v')) {
                    post('v');
                    return claim(ev);
                }

                // Plain Ctrl+C copies a selection only when copy-on-select is off. With it on the
                // selection is already on the clipboard, so Ctrl+C stays SIGINT — otherwise a
                // selection left on screen would swallow the interrupt, which a terminal must not do.
                if (ev.ctrlKey && !ev.shiftKey && !ev.altKey && (key === 'C' || key === 'c')) {
                    if (copyOnSelect || !term.hasSelection()) {
                        return true;
                    }

                    copySelection();
                    term.clearSelection();
                    return claim(ev);
                }
                if (ev.ctrlKey && !ev.shiftKey && !ev.altKey && (key === 'V' || key === 'v')) {
                    post('v');
                    return claim(ev);
                }
                // Cycle sessions. Ctrl+Tab is not a terminal sequence (Tab is Ctrl+I), so it is
                // safe to swallow here.
                if (ev.ctrlKey && !ev.altKey && key === 'Tab') {
                    post(ev.shiftKey ? 'kprevtab' : 'knexttab');
                    return claim(ev);
                }

                // Window-level commands: the WebView owns keyboard focus, so XAML accelerators
                // never see these. Forward them to the host instead.
                if (ev.ctrlKey && ev.shiftKey) {
                    var upper = key.toUpperCase();
                    if (upper === 'T') { post('knewtab'); return claim(ev); }
                    if (upper === 'W') { post('kclosesession'); return claim(ev); }
                    if (upper === 'B') { post('ksidebar'); return claim(ev); }
                    // Plain Ctrl+F stays with the shell (readline binds it to forward-char), so
                    // Find follows the other window chords onto Ctrl+Shift instead.
                    if (upper === 'F') { post('kfind'); return claim(ev); }
                    // Opens DevTools, and only a debug build answers. Nothing else reaches the
                    // page's own console: F12 is disabled with the browser accelerator keys, and
                    // right-click is paste.
                    if (upper === 'D') { post('kdevtools'); return claim(ev); }
                }

                // Tile every open session, or fold back to single view.
                if (ev.altKey && ev.shiftKey && !ev.ctrlKey) {
                    if (key === '+' || key === '=') { post('ktileside'); return claim(ev); }
                    if (key === '-' || key === '_') { post('ktilestack'); return claim(ev); }
                }

                // Font size, matching Windows Terminal's bindings.
                if (ev.ctrlKey && !ev.shiftKey && !ev.altKey) {
                    if (key === '=' || key === '+') { changeFontSize(1); return claim(ev); }
                    if (key === '-' || key === '_') { changeFontSize(-1); return claim(ev); }
                    if (key === '0') { setFontSize(14); return claim(ev); }
                }

                return true;
            });

            // ---- selection and clipboard ---------------------------------------------------
            // Copy lives on the host side: the WebView sandbox would prompt for permission and
            // cannot reach the Windows clipboard itself.
            var copyOnSelect = true;

            function copySelection() {
                var selection = term.getSelection();
                if (selection) {
                    post('c' + base64FromString(selection));
                }
            }

            // The host cannot see clicks landing inside the WebView, so tell it which pane was hit.
            // Middle-click pastes, the way X11 terminals do.
            term.element.addEventListener('mousedown', function (ev) {
                post('kfocus');

                if (ev.button === 1) {
                    ev.preventDefault();
                    post('v');
                }
            }, true);

            // Copy as soon as a drag-selection ends, so selecting is all it takes. Keyboard
            // selection (Shift+arrows) and the API are deliberately left alone: this fires on the
            // mouse gesture only, which is what makes it predictable.
            term.element.addEventListener('mouseup', function (ev) {
                if (copyOnSelect && ev.button === 0 && term.hasSelection()) {
                    copySelection();
                }
            }, true);

            // Double-click (word) and triple-click (line) land as one mouseup each, so they are
            // already covered by the handler above.

            // Right-click: hand off to the host's own menu (Copy/Paste/Find/Clear) rather than
            // guessing which one action the click meant. Native WinUI, not an HTML menu, so it
            // matches every other menu in the app and needs no styling of its own here.
            term.element.addEventListener('contextmenu', function (ev) {
                ev.preventDefault();
                post('u' + (term.hasSelection() ? '1' : '0') + ',' + ev.clientX + ',' + ev.clientY);
            });

            // Host -> terminal
            if (host) {
                host.addEventListener('message', function (ev) {
                    var raw = ev.data;
                    if (typeof raw !== 'string' || raw.length === 0) {
                        return;
                    }
                    var tag = raw[0];
                    var body = raw.substring(1);

                    switch (tag) {
                        case 'o': // shell output, base64-encoded UTF-8 bytes
                            term.write(bytesFromBase64(body));
                            break;
                        case 'm': // host-generated notice, already a plain string
                            term.write(body.replace(/\n/g, '\r\n'));
                            break;
                        case 'p': // paste payload coming back from the host clipboard
                            term.paste(body);
                            break;
                        case 'f':
                            term.focus();
                            break;
                        case 'z':
                            safeFit();
                            break;
                        case 'x':
                            term.clear();
                            scheduleHighlight();
                            break;
                        case 'h': // theme patch, e.g. {"background":"#101820","foreground":"#d8e0e8"}
                            try {
                                var patch = JSON.parse(body);
                                applyTheme(patch);
                                if (patch.background) {
                                    document.documentElement.style.background = patch.background;
                                    document.body.style.background = patch.background;
                                }
                            } catch (e) {
                                post('etheme parse failed: ' + e);
                            }
                            break;
                        case 'g': // highlight rules, e.g. [{"pattern":"error","color":"#f5c542"}]
                            try {
                                setHighlightRules(JSON.parse(body));
                            } catch (e) {
                                post('ehighlight parse failed: ' + e);
                            }
                            break;
                        case 'w': // copy-on-select preference, "1" or "0"
                            copyOnSelect = body === '1';
                            break;
                        case 'a': // auto-approve AI prompts, "1" or "0"
                            autoApprove = body === '1';
                            lastApproved = '';
                            scheduleHighlight();
                            break;
                        case 'y': // font family, or empty for "pick one that lines Hangul up"
                            applyFontFamily(body);
                            break;
                        case 's': // font size, e.g. "s14"
                            var size = parseInt(body, 10);
                            if (!isNaN(size) && size >= 6 && size <= 40) {
                                term.options.fontSize = size;
                                safeFit();
                            }
                            break;
                        case 'b': // host asked for the buffer as plain text, to save to a file
                            post('b' + base64FromString(bufferText()));
                            break;
                        case 'l': // scrollback line count, e.g. "l5000"
                            var lines = parseInt(body, 10);
                            if (!isNaN(lines) && lines >= 100 && lines <= 9999) {
                                term.options.scrollback = lines;
                            }
                            break;
                        case 'q': // context menu's Copy — the selection made before it was opened
                            copySelection();
                            break;
                        case 'd': // context menu's Select All
                            term.selectAll();
                            break;
                        case 'j': // Find: scroll so buffer line N sits mid-screen
                            var target = parseInt(body, 10);
                            if (!isNaN(target)) {
                                term.scrollToLine(Math.max(0, target - Math.floor(term.rows / 2)));
                            }
                            break;
                    }
                });
            }

            var resizeObserver = new ResizeObserver(function () {
                safeFit();
            });
            resizeObserver.observe(document.body);

            window.addEventListener('focus', function () {
                term.focus();
            });

            safeFit();
            term.focus();
            post('r' + term.cols + ',' + term.rows);
            post('ready');
        })();
    </script>
</body>
</html>
